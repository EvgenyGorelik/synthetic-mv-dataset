[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "synth-ndf-dataset"
version = "0.1.0"
description = "A Python package with main functions inside the synth_ndf_dataset directory."
authors = [
    { name="Evgeny Gorelik", email="evgeny.gorelik@gt-arc.com" }
]
dependencies = [
    "numpy>=1.23.0",
    "pillow>=8.4.0",
    "tqdm>=4.67.3",
    "scipy>=1.10.1",
    "matplotlib-inline>=0.1.7",
    "opencv-python>=4.11.0.86",
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/EvgenyGorelik/ndf-dataset-synth"

[tool.setuptools]
package-dir = {"synth_ndf_dataset" = "synth_ndf_dataset"}
